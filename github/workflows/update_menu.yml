name: Auto-Update UTSC Harmony Commons Menu

on:
   workflow_dispatch: # Allows manual 1-click trigger in GitHub UI
  schedule:
    # Runs every 30 minutes during UTSC dining hall hours (11:00–23:59 UTC / 7:00 AM–8:00 PM EDT)
    - cron: '*/30 11-23 * * *'
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Pull live menu from UTSC MyDiningHub
        run: |
          python3 utsc_menu_server.py --once
          cp utsc_harmony_commons_signage.html index.html

      - name: Commit and push updated menu data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu_data.json live_menu_snapshot.png index.html
          git diff --staged --quiet || git commit -m "Auto-update UTSC Harmony Commons menu"
          git push
