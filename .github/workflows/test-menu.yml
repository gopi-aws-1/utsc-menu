name: Test menu display

on:
  push:
    branches: [Movie-date]
    paths:
      - 'index.html'
      - 'utsc_harmony_commons_signage.html'
      - 'tests/**'
      - '.github/workflows/test-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test screen and controls (maximum 90 seconds)
        run: timeout 90s python -m unittest discover -s tests -p 'test_signage_controls.py' -v
