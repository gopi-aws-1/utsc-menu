name: Sync Harmony Commons menu
on:
  push:
    branches: [Movie-date]
    paths:
      - '.github/workflows/update-menu.yml'
      - 'utsc_menu_server.py'
      - 'requirements.txt'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harmony-menu-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Fetch and verify current menu
        id: update
        continue-on-error: true
        run: python utsc_menu_server.py --once --debug
      - name: Commit verified data or failure status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu_data.json sync_status.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Harmony Commons live menu and sync status"
            git push
          fi
      - name: Upload menu selector diagnostics (on failure)
        if: steps.update.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mydininghub-debug
          path: |
            menu_debug.html
            menu_debug.png
            menu_debug_frame_*.html
            menu_debug_diagnostics.json
          if-no-files-found: warn
          retention-days: 7
      - name: Report unsuccessful update
        if: steps.update.outcome == 'failure'
        run: |
          echo 'Menu verification failed; no unverified meals published.' >&2
          exit 1
