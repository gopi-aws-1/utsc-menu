name: Sync Harmony Commons menu
on:
  push:
    branches: [Movie-date]
    paths:
      - '.github/workflows/update-menu.yml'
      - 'utsc_menu_server.py'
      - 'requirements.txt'
  schedule:
    # Native 10-minute backup; GitHub documents that scheduled events can be dropped.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_if_recent:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: harmony-commons-live-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Skip duplicate backup sync when recently verified
        id: recency
        env:
          SKIP_IF_RECENT: ${{ inputs.skip_if_recent }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          should_sync = True
          if os.getenv("SKIP_IF_RECENT", "false").lower() == "true":
              try:
                  data = json.loads(Path("menu_data.json").read_text(encoding="utf-8"))
                  timestamp = data.get("fetchedAtEpochMs")
                  if not isinstance(timestamp, (float, int)):
                      timestamp = datetime.datetime.fromisoformat(data["fetchedAt"]).timestamp() * 1000
                  seconds = datetime.datetime.now(datetime.timezone.utc).timestamp() - timestamp / 1000
                  should_sync = not (data.get("verifiedSource") is True and -120 <= seconds <= 7 * 60)
              except (OSError, ValueError, TypeError, KeyError):
                  should_sync = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("should_sync=" + str(should_sync).lower() + "\n")
          print("Run MyDiningHub scraper:", should_sync)
          PY
      - name: Install Python dependencies and Chromium
        if: steps.recency.outputs.should_sync == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch verified MyDiningHub data (retry up to three times)
        if: steps.recency.outputs.should_sync == 'true'
        id: update
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "Source fetch attempt ${attempt}/3"
            if python utsc_menu_server.py --once --debug; then
              echo "Verified source fetch succeeded"
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then sleep 12; fi
          done
          echo "All source fetch attempts failed" >&2
          exit 1

      - name: Publish verified menu or failure status
        if: steps.recency.outputs.should_sync == 'true'
        # Always publish the status even if source extraction is unsuccessful.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu_data.json sync_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync Harmony Commons menu data"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                git rebase --abort || true
                echo "A newer menu/status update already exists; not overwriting it" >&2
                exit 1
              fi
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              sleep 5
            done
            echo "Unable to publish menu data after three pushes" >&2
            exit 1
          fi
      - name: Upload diagnostics if source extraction fails
        if: steps.recency.outputs.should_sync == 'true' && steps.update.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: menu-extraction-diagnostics
          path: |
            menu_debug.html
            menu_debug.png
            menu_debug_frame_*.html
            menu_debug_diagnostics.json
          if-no-files-found: warn
          retention-days: 3
      - name: Fail visibly when source cannot be verified
        if: steps.recency.outputs.should_sync == 'true' && steps.update.outcome == 'failure'
        run: exit 1
